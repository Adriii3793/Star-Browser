[package]
name = "star"
version = "1.1.1"
description = "A minimalist AI browser"
authors = ["Star Development Team"]
edition = "2021"
license = "MIT"
homepage = "https://github.com/Adriii3793/Star-Browser"
repository = "https://github.com/Adriii3793/Star-Browser"


[lib]
name = "star_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2.3.2"
sqlx = { version = "0.8", features =  ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2"
dotenvy = "0.15"
url = "2"

reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
